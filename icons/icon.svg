    <!-- Footprint 2 -->
    <ellipse cx="220" cy="220" rx="55" ry="85" fill="url(#grad1)" opacity="0.7"/>
    <circle cx="190" cy="135" r="16" fill="url(#grad1)" opacity="0.7"/>
    <circle cx="220" cy="125" r="14" fill="url(#grad1)" opacity="0.7"/>
    <circle cx="250" cy="130" r="13" fill="url(#grad1)" opacity="0.7"/>
